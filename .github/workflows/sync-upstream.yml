name: Sync upstream
on:
  schedule:
    - cron: '0 6 * * *'  # 每天 UTC 06:00（北京时间 14:00）
  workflow_dispatch:       # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: master
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Fetch upstream
      run: |
        git remote add upstream https://github.com/FWGS/xash3d-fwgs.git
        git fetch upstream master

    - name: Check for new commits
      id: check
      run: |
        LOCAL=$(git rev-parse HEAD)
        UPSTREAM=$(git rev-parse upstream/master)
        if [ "$LOCAL" = "$UPSTREAM" ]; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "Already up to date."
        else
          echo "changed=true" >> $GITHUB_OUTPUT
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "Behind by $BEHIND commits."
        fi

    - name: Merge upstream
      if: steps.check.outputs.changed == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # Use -X theirs to automatically resolve conflicts by preferring upstream version
        git merge upstream/master --no-edit -X theirs -m "chore: sync with upstream FWGS/xash3d-fwgs"
        # Submodule conflicts need special handling
        git submodule update --init --recursive --remote --merge || git submodule update --init --recursive --checkout
        git push origin master --force-with-lease
