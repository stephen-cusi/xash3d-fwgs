name: Sync upstream
on:
  schedule:
    - cron: '0 6 * * *'  # 每天 UTC 06:00（北京时间 14:00）
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: master
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Sync with upstream
      run: bash .github/sync-upstream.sh
