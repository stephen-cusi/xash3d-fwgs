name: Sync upstream
on:
  schedule:
    - cron: '0 6 * * *'  # 每天 UTC 06:00（北京时间 14:00）
  workflow_dispatch:       # 支持手动触发

# No permissions: block here. The sync push can legitimately update files
# under .github/workflows (upstream edits them), and the workflows scope
# cannot be granted inside a permissions block - it comes from the
# repository default token permissions (Settings -> Actions -> General).

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: master
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Sync with upstream
      run: bash .github/sync-upstream.sh
